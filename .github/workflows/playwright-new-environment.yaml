name: Playwright Tests (New Environment)
on:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    branches: [main, master]
    paths: ["InterneTaakAfhandeling.EndToEndTest/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-tests-new-environment-group
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./InterneTaakAfhandeling.EndToEndTest
    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build
      - name: Ensure browsers are installed
        run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps
      - name: Run your tests
        id: e2e
        run: dotnet test --settings playwright.runsettings
        env:
          "TestSettings:TEST_USERNAME": ${{ secrets.PLAYWRIGHT_USERNAME_NEW_ENVIRONMENT }}
          "TestSettings:TEST_PASSWORD": "${{ secrets.PLAYWRIGHT_PASSWORD_NEW_ENVIRONMENT }}"
          "TestSettings:TEST_TOTP_SECRET": ${{ secrets.PLAYWRIGHT_TOTP_SECRET_NEW_ENVIRONMENT }}
          "TestSettings:TEST_BASE_URL": ${{ secrets.PLAYWRIGHT_BASE_URL_NEW_ENVIRONMENT }}
          "TestSettings:OpenKlantApi:BaseUrl": ${{ secrets.PLAYWRIGHT_OPENKLANTAPI_BASEURL_NEW_ENVIRONMENT }}
          "TestSettings:OpenKlantApi:ApiKey": ${{ secrets.PLAYWRIGHT_OPENKLANTAPI_APIKEY_NEW_ENVIRONMENT }}
          "TestSettings:ObjectApi:BaseUrl": ${{ secrets.PLAYWRIGHT_OBJECTAPI_BASEURL_NEW_ENVIRONMENT }}
          "TestSettings:ObjectApi:ApiKey": ${{ secrets.PLAYWRIGHT_OBJECTAPI_APIKEY_NEW_ENVIRONMENT }}
          "TestSettings:LogBoekOptions:TypeVersion": ${{ secrets.PLAYWRIGHT_LOGBOEKOPTIONS_TYPEVERSION_NEW_ENVIRONMENT }}
          "TestSettings:LogBoekOptions:Type": ${{ secrets.PLAYWRIGHT_LOGBOEKOPTIONS_TYPE_NEW_ENVIRONMENT }}
          "TestSettings:GroepOptions:TypeVersion": ${{ secrets.PLAYWRIGHT_GROEPOPTIONS_TYPEVERSION_NEW_ENVIRONMENT }}
          "TestSettings:GroepOptions:Type": ${{ secrets.PLAYWRIGHT_GROEPOPTIONS_TYPE_NEW_ENVIRONMENT }}
          "TestSettings:AfdelingOptions:TypeVersion": ${{ secrets.PLAYWRIGHT_AFDELINGOPTIONS_TYPEVERSION_NEW_ENVIRONMENT }}
          "TestSettings:AfdelingOption:Type": ${{ secrets.PLAYWRIGHT_AFDELINGOPTIONS_TYPE_NEW_ENVIRONMENT }}
          "TestSettings:ZakenApi:BaseUrl": ${{ secrets.PLAYWRIGHT_ZAKENAPI_BASEURL_NEW_ENVIRONMENT }}
          "TestSettings:ZakenApi:Key": ${{ secrets.PLAYWRIGHT_ZAKENAPI_APIKEY_NEW_ENVIRONMENT }}
          "TestSettings:ZakenApi:ClientId": ${{ secrets.PLAYWRIGHT_ZAKENAPI_CLIENTID_NEW_ENVIRONMENT }}
      - name: Upload Playwright traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-new-environment
          path: "./InterneTaakAfhandeling.EndToEndTest/bin/Debug/net8.0/playwright-traces"
      - name: Upload Playwright screenshots
        if: always() # Ensures this runs even if the tests fail
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-new-environment
          path: InterneTaakAfhandeling.EndToEndTest/bin/Debug/net8.0/screenshots/
